# Generated by ReleaseWorks for NDS-2026-001 - SampleApi (.NET)
# Release start: 2026-11-02 22:00 WIB | Requested by: tiaherdi
# Detected: .NET application SampleApi
# Flow: build -> test -> deploy (manual approval) -> verify -> rollback (only on failure)
# Deploy jobs run on the runner installed ON TIA, so no server credentials are stored.
# Approval: Settings > Environments > production > Required reviewers (= GitLab `when: manual`).

name: 'ReleaseWorks NDS-2026-001 - build, test, deploy'

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: releaseworks-production
  cancel-in-progress: false

permissions:
  contents: read
  checks: write # publish test report

env:
  # ---- Detected from source code ----
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'src/SampleApi/SampleApi.csproj'
  # ---- From the ReleaseWorks form ----
  APP_PATH: 'D:\Apps\SampleApi'
  BACKUP_ROOT: 'D:\Backups\SampleApi'
  APP_TYPE: 'service'  # none | iis | service | custom
  APP_NAME: 'SampleApi'
  STOP_SCRIPT: ''
  START_SCRIPT: ''
  PRESERVE_FILES: 'appsettings.Production.json'
  PRESERVE_DIRS: 'logs'
  HEALTH_URL: 'http://localhost:5080/salah'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}
      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release --no-restore -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish
          retention-days: 14

  test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run tests
        run: dotnet test 'tests/SampleApi.Tests/SampleApi.Tests.csproj' -c Release --logger "junit;LogFilePath=${{ github.workspace }}/test-results/{assembly}.xml"
      - name: Test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Test results
          path: test-results/*.xml
          reporter: java-junit

  deploy:
    needs: test
    runs-on: [self-hosted, windows, production]
    environment: production
    outputs:
      backup_path: ${{ steps.deploy.outputs.backup_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: ${{ runner.temp }}\app
      - name: Backup, stop, deploy, start
        id: deploy
        shell: powershell
        run: .\releaseworks\deploy.ps1 -SourcePath "${{ runner.temp }}\app" -TargetPath $env:APP_PATH -BackupRoot $env:BACKUP_ROOT -AppType $env:APP_TYPE -AppName $env:APP_NAME -StopScript $env:STOP_SCRIPT -StartScript $env:START_SCRIPT -PreserveFiles $env:PRESERVE_FILES -PreserveDirs $env:PRESERVE_DIRS

  verify:
    needs: deploy
    runs-on: [self-hosted, windows, production]
    steps:
      - uses: actions/checkout@v4
      - name: Health check
        shell: powershell
        run: .\releaseworks\verify.ps1 -HealthUrl $env:HEALTH_URL -AppType $env:APP_TYPE -AppName $env:APP_NAME

  # Runs only when deploy or verify failed AND a backup exists.
  # Repository variable AUTO_ROLLBACK=false keeps the failed state for investigation instead.
  rollback:
    needs: [deploy, verify]
    if: failure() && needs.deploy.outputs.backup_path != '' && vars.AUTO_ROLLBACK != 'false'
    runs-on: [self-hosted, windows, production]
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous version
        shell: powershell
        run: .\releaseworks\rollback.ps1 -BackupPath "${{ needs.deploy.outputs.backup_path }}" -TargetPath $env:APP_PATH -AppType $env:APP_TYPE -AppName $env:APP_NAME -StopScript $env:STOP_SCRIPT -StartScript $env:START_SCRIPT
      - name: Verify previous version
        shell: powershell
        run: .\releaseworks\verify.ps1 -HealthUrl $env:HEALTH_URL -AppType $env:APP_TYPE -AppName $env:APP_NAME
